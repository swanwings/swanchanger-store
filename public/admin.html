<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwanChanger — Admin Key Generator</title>
<link rel="icon" type="image/png" href="/assets/shots/logo.png">
<style>
  :root {
    --bg: #07060c; --panel: #100d1b; --line: #241c38; --line2: #332752;
    --txt: #f3f0ff; --dim: #9b93b5; --acc: #a78bfa; --acc2: #7c3aed;
    --neon: #d8ff00; --ok: #35d07f; --bad: #ff5f6d;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.6 "Segoe UI", Inter, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    padding: 24px;
  }
  .admin-box {
    width: min(600px, 100%); background: var(--panel); border: 1px solid var(--line2);
    border-radius: 20px; padding: 36px; box-shadow: 0 20px 60px rgba(0,0,0,.7);
    position: relative;
  }
  .brand-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .brand-head img { width: 38px; height: 38px; }
  .brand-head h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .06em; }
  .brand-head span { font-size: 11.5px; color: var(--neon); font-weight: 700; display: block; }
  
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--dim); margin-bottom: 6px; }
  select, input {
    width: 100%; padding: 12px 14px; background: rgba(255,255,255,.05);
    border: 1px solid var(--line2); border-radius: 10px; color: #fff; font: inherit;
    font-size: 14px; outline: none; transition: border-color .2s;
  }
  select:focus, input:focus { border-color: var(--acc); }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  
  .btn-gen {
    width: 100%; padding: 14px; background: var(--neon); color: #000;
    font-size: 15px; font-weight: 800; border: none; border-radius: 12px;
    cursor: pointer; transition: all .2s; margin-top: 10px;
    box-shadow: 0 6px 20px rgba(216,255,0,.35);
  }
  .btn-gen:hover { background: #c4eb00; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(216,255,0,.5); }
  
  .output-box {
    margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);
    display: none;
  }
  .output-box.show { display: block; }
  .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .output-title { font-size: 13px; font-weight: 700; color: var(--ok); }
  
  .btn-copy {
    padding: 6px 14px; border-radius: 8px; background: rgba(124,58,237,.2);
    border: 1px solid var(--acc); color: #fff; font-size: 12.5px; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }
  .btn-copy:hover { background: var(--acc2); }

  textarea {
    width: 100%; height: 160px; background: #07060c; border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; color: #a78bfa; font-family: monospace;
    font-size: 13px; resize: none; -webkit-user-select: text; user-select: text;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #1e1336; border: 1px solid var(--ok); color: var(--ok);
    padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 13px;
    opacity: 0; transition: all .25s; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="admin-box">
  <div class="brand-head">
    <img src="/assets/shots/logo.png" alt="SwanChanger Logo">
    <div>
      <h2>SWANCHANGER ADMIN</h2>
      <span>LİSANS ANAHTARI ÜRETİM PANELİ</span>
    </div>
  </div>

  <div class="form-group">
    <label>Lisans Süresi</label>
    <select id="durationSelect">
      <option value="7">7 Günlük (Haftalık Plan)</option>
      <option value="30" selected>30 Günlük (Aylık Plan)</option>
      <option value="90">90 Günlük (3 Aylık Paket)</option>
      <option value="365">365 Günlük (1 Yıllık Paket)</option>
      <option value="0">Sınırsız (Lifetime / VIP)</option>
    </select>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Üretilecek Adet</label>
      <input type="number" id="countInput" value="1" min="1" max="100">
    </div>
    <div class="form-group">
      <label>Tier / Yetki Seviyesi</label>
      <select id="tierSelect">
        <option value="1" selected>Tier 1 (Standart CS2)</option>
        <option value="2">Tier 2 (Premium VIP)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Özel HWID Kilidi (İsteğe bağlı — Boşsa her cihazda çalışır)</label>
    <input type="text" id="hwidInput" placeholder="Örn: 419184FC97CBE662D94F9E7E5A28E517">
  </div>

  <button class="btn-gen" id="genBtn" type="button">🔑 Anahtarları Üret</button>

  <div class="output-box" id="outputBox">
    <div class="output-header">
      <span class="output-title" id="outCountMsg">✓ 1 Adet Anahtar Üretildi</span>
      <div style="display:flex;gap:8px">
        <button class="btn-copy" id="copyBtn" type="button">📋 Panoya Kopyala</button>
        <button class="btn-copy" id="dlBtn" type="button">💾 İndir (.txt)</button>
      </div>
    </div>
    <textarea id="keysTextarea" readonly></textarea>
  </div>
</div>

<div class="toast" id="toast">Panoya kopyalandı!</div>

<script>
function generateSwanKey(days, tier, hwid) {
  const b = new Uint8Array(36);
  b[0] = 0x53; // 'S' magic byte
  b[1] = tier & 0xFF;
  b[2] = 0; // padding

  const ts = (days === 0) ? 0 : (Math.floor(Date.now() / 1000) + days * 86400);
  b[3] = (ts >>> 24) & 0xFF;
  b[4] = (ts >>> 16) & 0xFF;
  b[5] = (ts >>> 8) & 0xFF;
  b[6] = ts & 0xFF;

  const salt = new Uint8Array(28);
  crypto.getRandomValues(salt);
  for (let i = 0; i < 28; i++) {
    let v = salt[i];
    if (hwid && i < hwid.length) {
      v ^= hwid.charCodeAt(i) & 0xFF;
    }
    b[7 + i] = v;
  }

  // Checksum = XOR(b[1]..b[34])
  let chk = 0;
  for (let i = 1; i < 35; i++) {
    chk ^= b[i];
  }
  b[35] = chk & 0xFF;

  // Convert to hex
  let hex = "";
  for (let i = 0; i < 36; i++) {
    hex += b[i].toString(16).padStart(2, "0").toUpperCase();
  }

  // Format: 9 groups of 8 (or chunks of 4) -> XXXX-XXXX-...
  return hex.match(/.{1,4}/g).join("-");
}

const genBtn = document.getElementById("genBtn");
const durationSelect = document.getElementById("durationSelect");
const countInput = document.getElementById("countInput");
const tierSelect = document.getElementById("tierSelect");
const hwidInput = document.getElementById("hwidInput");
const outputBox = document.getElementById("outputBox");
const keysTextarea = document.getElementById("keysTextarea");
const outCountMsg = document.getElementById("outCountMsg");
const copyBtn = document.getElementById("copyBtn");
const dlBtn = document.getElementById("dlBtn");
const toast = document.getElementById("toast");

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

genBtn.addEventListener("click", () => {
  const days = parseInt(durationSelect.value, 10);
  const count = Math.max(1, Math.min(100, parseInt(countInput.value, 10) || 1));
  const tier = parseInt(tierSelect.value, 10);
  const hwid = hwidInput.value.trim();

  const keys = [];
  for (let i = 0; i < count; i++) {
    keys.push(generateSwanKey(days, tier, hwid));
  }

  keysTextarea.value = keys.join("\n");
  outCountMsg.textContent = `✓ ${count} Adet Geçerli Anahtar Üretildi (${days === 0 ? "Sınırsız" : days + " Gün"})`;
  outputBox.classList.add("show");
  showToast(`${count} anahtar başarıyla üretildi!`);
});

copyBtn.addEventListener("click", () => {
  if (!keysTextarea.value) return;
  navigator.clipboard.writeText(keysTextarea.value).then(() => {
    showToast("Anahtarlar panoya kopyalandı!");
  });
});

dlBtn.addEventListener("click", () => {
  if (!keysTextarea.value) return;
  const blob = new Blob([keysTextarea.value], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `swanchanger_keys_${Date.now()}.txt`;
  a.click();
});
</script>
</body>
</html>
